<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyatomic Ions Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input[type="text"] {
            padding: 12px;
            font-size: 1em;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        input[type="text"]:disabled {
            background-color: #ecf0f1;
            cursor: not-allowed;
        }
        button {
            padding: 10px 15px;
            font-size: 1em;
            border: 2px solid #3498db;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }
        #next-btn {
            margin-top: 20px;
            background-color: #2c3e50;
            border-color: #2c3e50;
            display: none;
            width: 100%;
        }
        #next-btn:hover {
            background-color: #1a252f;
            border-color: #1a252f;
        }
        .score-container {
            text-align: center;
            font-size: 1.5em;
            display: none;
        }
        .feedback {
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }
        .correct-text { color: #2ecc71; }
        .incorrect-text { color: #e74c3c; }
        .correction {
            font-weight: normal;
            font-size: 0.9em;
            color: #333;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz">
        <h1>Polyatomic Ions Quiz</h1>
        <div id="question-text" class="question"></div>
        
        <div class="input-container">
            <input type="text" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
            <button id="submit-btn" onclick="checkAnswer()">Submit</button>
            <div id="feedback" class="feedback"></div>
        </div>

        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
    
    <div id="score-container" class="score-container">
        <h2>Quiz Completed!</h2>
        <p>Your Score: <span id="score"></span> / <span id="total-questions"></span></p>
        <button onclick="location.reload()">Restart Quiz</button>
    </div>
</div>

<script>
    // Updated quizData to accept text variations and provide a display answer
    const quizData = [
        {
            question: "What is the formula and charge for Acetate?",
            acceptedAnswers: ["C2H3O2-", "CH3COO-", "C2H3O2^-", "CH3COO^-"],
            displayAnswer: "C2H3O2- or CH3COO-"
        },
        {
            question: "What is the name of NH4+?",
            acceptedAnswers: ["Ammonium"],
            displayAnswer: "Ammonium"
        },
        {
            question: "What is the formula and charge for Carbonate?",
            acceptedAnswers: ["CO32-", "CO3^2-", "CO3-2"],
            displayAnswer: "CO3 2-"
        },
        {
            question: "What is the name of OH-?",
            acceptedAnswers: ["Hydroxide"],
            displayAnswer: "Hydroxide"
        },
        {
            question: "What is the formula and charge for Nitrate?",
            acceptedAnswers: ["NO3-", "NO3^-"],
            displayAnswer: "NO3 -"
        },
        {
            question: "What is the name of NO2-?",
            acceptedAnswers: ["Nitrite"],
            displayAnswer: "Nitrite"
        },
        {
            question: "What is the formula and charge for Phosphate?",
            acceptedAnswers: ["PO43-", "PO4^3-", "PO4-3"],
            displayAnswer: "PO4 3-"
        },
        {
            question: "What is the name of SO4 2-?",
            acceptedAnswers: ["Sulfate"],
            displayAnswer: "Sulfate"
        },
        {
            question: "What is the formula and charge for Sulfite?",
            acceptedAnswers: ["SO32-", "SO3^2-", "SO3-2"],
            displayAnswer: "SO3 2-"
        },
        {
            question: "What is the name of ClO4-?",
            acceptedAnswers: ["Perchlorate"],
            displayAnswer: "Perchlorate"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById("question-text");
    const answerInput = document.getElementById("answer-input");
    const submitBtn = document.getElementById("submit-btn");
    const nextBtn = document.getElementById("next-btn");
    const feedback = document.getElementById("feedback");
    const quizContainer = document.getElementById("quiz");
    const scoreContainer = document.getElementById("score-container");
    const scoreText = document.getElementById("score");
    const totalQuestionsText = document.getElementById("total-questions");

    // Allow pressing "Enter" to submit the answer
    answerInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter" && !answerInput.disabled) {
            event.preventDefault();
            checkAnswer();
        } else if (event.key === "Enter" && answerInput.disabled && nextBtn.style.display === "block") {
            event.preventDefault();
            nextQuestion();
        }
    });

    function loadQuestion() {
        const currentQuestion = quizData[currentQuestionIndex];
        questionText.innerHTML = `Question ${currentQuestionIndex + 1}/${quizData.length}: <br><br> ${currentQuestion.question}`;
        
        // Reset UI for the new question
        answerInput.value = "";
        answerInput.disabled = false;
        feedback.innerHTML = "";
        submitBtn.style.display = "block";
        nextBtn.style.display = "none";
        answerInput.focus();
    }

    function checkAnswer() {
        const userInput = answerInput.value;
        
        // Prevent submitting empty answers
        if (userInput.trim() === "") return;

        const currentQuestion = quizData[currentQuestionIndex];
        
        // Normalize input: remove spaces and make lowercase to make grading forgiving
        const normalizedInput = userInput.toLowerCase().replace(/\s+/g, '');
        
        let isCorrect = false;
        for (let i = 0; i < currentQuestion.acceptedAnswers.length; i++) {
            const normalizedCorrect = currentQuestion.acceptedAnswers[i].toLowerCase().replace(/\s+/g, '');
            if (normalizedInput === normalizedCorrect) {
                isCorrect = true;
                break;
            }
        }

        if (isCorrect) {
            score++;
            feedback.innerHTML = `<span class="correct-text">Correct!</span>`;
        } else {
            feedback.innerHTML = `<span class="incorrect-text">Incorrect.</span><div class="correction">The correct answer was: <strong>${currentQuestion.displayAnswer}</strong></div>`;
        }

        // Lock in the answer
        answerInput.disabled = true;
        submitBtn.style.display = "none";
        nextBtn.style.display = "block";
        nextBtn.focus();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        quizContainer.style.display = "none";
        scoreContainer.style.display = "block";
        scoreText.innerText = score;
        totalQuestionsText.innerText = quizData.length;
    }

    // Initialize quiz
    loadQuestion();
</script>

</body>
</html>
