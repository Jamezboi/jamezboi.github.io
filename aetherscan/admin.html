<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="color-scheme" content="dark"/><meta name="robots" content="noindex,nofollow"/><title>Key Issuer — AetherScan Admin</title><link rel="icon" href="favicon.svg" type="image/svg+xml"/><style>
:root{--bg:#0b0d12;--surface:rgba(255,255,255,.05);--surface-strong:rgba(255,255,255,.085);--border:rgba(255,255,255,.085);--text:#f2f4f8;--text-2:#a6adbb;--text-3:#6b7280;--accent:#0a84ff;--accent-2:#5e5ce6;--green:#30d158;--red:#ff453a;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);color:var(--text);background:radial-gradient(1000px 460px at 85% -10%,rgba(94,92,230,.14),transparent 60%),var(--bg);min-height:100vh;padding:40px 20px 60px}.page{max-width:640px;margin:0 auto}.lock-badge{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:rgba(10,132,255,.13);border:1px solid rgba(10,132,255,.35);font-size:24px;margin-bottom:16px}h1{font-size:24px;margin-bottom:6px}.sub,.meta{color:var(--text-2);font-size:13.5px;margin-bottom:24px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:18px}label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);margin:14px 0 5px}input,select{width:100%;background:var(--surface-strong);border:1px solid var(--border);border-radius:11px;padding:10px 13px;font-size:14px;color:var(--text);outline:none}.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.btn{padding:10px 18px;border-radius:12px;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--border);background:var(--surface-strong);color:var(--text)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.error{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}.key-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:14px;background:var(--surface-strong);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin:6px 0}.hidden{display:none}.meta{font-size:11.5px;color:var(--text-3);margin-top:14px;line-height:1.6}
</style></head><body><div class="page"><div class="lock-badge">🔑</div><h1>AetherScan Key Issuer</h1><p class="sub">Staff-only license issuer. The password is checked locally; license issuance is authorized by the server-side verification code.</p><div class="card" id="gate"><label for="admin-pw">Admin password</label><input type="password" id="admin-pw" autocomplete="off"/><div class="error" id="gate-error"></div><div class="row"><button class="btn primary" id="unlock-btn">Unlock issuer</button></div></div><div class="card hidden" id="issuer"><h1 style="font-size:18px">Issue license keys</h1><label for="secret-code">Verification code</label><input type="password" id="secret-code" autocomplete="off" placeholder="Enter the private verification code"/><label for="key-tier">Edition</label><select id="key-tier"><option value="pro">AetherScan Pro — $24</option><option value="ultimate">AetherScan Ultimate — $59</option></select><label for="key-count">Quantity</label><select id="key-count"><option>1</option><option>5</option><option>10</option><option>25</option></select><div class="row"><button class="btn primary" id="gen-btn">Generate keys</button><button class="btn" id="copy-all" disabled>Copy all</button><button class="btn" id="download-all" disabled>Download .txt</button></div><div class="error" id="issue-error"></div><div id="key-list" style="margin-top:8px"></div><p class="meta">Issued keys are registered server-side and can be redeemed only once.</p></div></div><script>
(()=>{const FN="https://mdvbiwmlxsvcmexbsrps.supabase.co/functions/v1/aetherscan-license",HASH="ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f";const $=s=>document.querySelector(s);let issued=[];async function sha(t){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}$("#unlock-btn").onclick=async()=>{if(await sha($("#admin-pw").value)===HASH){sessionStorage.setItem("aetherscan-admin-ok","1");$("#gate").classList.add("hidden");$("#issuer").classList.remove("hidden")}else $("#gate-error").textContent="Wrong password."};$("#admin-pw").onkeydown=e=>{if(e.key==="Enter")$("#unlock-btn").click()};$("#gen-btn").onclick=async()=>{const code=$("#secret-code").value.trim();if(!code){$("#issue-error").textContent="Enter the verification code.";return}const btn=$("#gen-btn");btn.disabled=true;btn.textContent="Generating…";$("#issue-error").textContent="";try{for(let i=0;i<parseInt($("#key-count").value,10);i++){const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"issue",code,tier:$("#key-tier").value})});const x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||"Issue failed");issued.unshift(x.key)}render()}catch(e){$("#issue-error").textContent=e.message}btn.disabled=false;btn.textContent="Generate keys"};function render(){$("#key-list").innerHTML=issued.map(k=>`<div class="key-line"><span>${k}</span><button class="btn" data-key="${k}">Copy</button></div>`).join("");$("#key-list").querySelectorAll("button").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.key));$("#copy-all").disabled=!issued.length;$("#download-all").disabled=!issued.length}$("#copy-all").onclick=()=>navigator.clipboard.writeText(issued.join("\n"));$("#download-all").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([issued.join("\n")+"\n"],{type:"text/plain"}));a.download="aetherscan-keys.txt";a.click()};if(sessionStorage.getItem("aetherscan-admin-ok")){ $("#gate").classList.add("hidden");$("#issuer").classList.remove("hidden")}})();
</script></body></html>
