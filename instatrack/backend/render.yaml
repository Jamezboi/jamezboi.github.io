services:
  - type: web
    name: instatrack-worker
    runtime: docker
    dockerfilePath: ./instatrack/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
